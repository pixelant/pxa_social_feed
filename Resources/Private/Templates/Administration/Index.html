<div xmlns="http://www.w3.org/1999/xhtml" lang="en"
     xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

    <f:layout name="Module" />

    <f:section name="Content">
        <div class="pxa-social-feed-be-adminnistration" data-browser-url="{browserUrl}">
        <f:flashMessages />

        <div id="tokens-confs">
            <ul id="tabs" class="nav nav-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a id="configurations-tab" class="nav-link tab-switch{f:if(condition: activeTokenTab, else: ' active')}" href="#configurations" data-bs-toggle="tab" role="tab" aria-controls="configurations" aria-selected="{f:if(condition: activeTokenTab, then: 'false', else: 'true')}"><f:translate key="module.configurations"/></a>
                </li>
                <li class="nav-item" role="presentation">
                    <a id="tokens-tab" class="nav-link tab-switch{f:if(condition: isTokensValid, else: ' has-validation-error')}{f:if(condition: activeTokenTab, then: ' active')}" href="#tokens" data-bs-toggle="tab" role="tab" aria-controls="tokens" aria-selected="{f:if(condition: activeTokenTab, then: 'true', else: 'false')}"><f:translate key="module.tokens"/></a>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane{f:if(condition: activeTokenTab, else: ' show active')}" id="configurations" role="tabpanel" aria-labelledby="configurations-tab">
                    <br>
                    <f:render partial="Backend/ListConfigurations" section="list" arguments="{configurations: configurations, isAdmin: isAdmin}"/>
                    <f:link.action class="btn btn-default" action="editConfiguration">
                        <f:translate key="module.add_new"/>
                    </f:link.action>
                </div>

                <div class="tab-pane{f:if(condition: activeTokenTab, then: ' show active')}" id="tokens"  role="tabpanel" aria-labelledby="tokens-tab">
                    <br>
                    <f:render partial="Backend/ListTokens" section="list" arguments="{tokens: tokens}"/>
                    <f:link.action class="btn btn-default" action="editToken">
                        <f:translate key="module.add_new"/>
                    </f:link.action>
                </div>
            </div>
        </div>
        </div>
    </f:section>
</div>
