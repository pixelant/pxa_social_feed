name: Continuous Integration

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: TYPO3 13.4 / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, gd, zip
          tools: composer:v2
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer update --prefer-dist --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Run checks
        run: composer tests:all

  javascript:
    name: Backend JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Tests/JavaScript/*.test.mjs
